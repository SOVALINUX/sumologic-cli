[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-sumologic"
version = "1.2.0"
description = "CLI harness for Sumo Logic log search API — agent-friendly interface"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
authors = [{ name = "Siarhei Nekhviadovich" }]
requires-python = ">=3.10"
keywords = [
    "sumologic",
    "sumo-logic",
    "cli",
    "log-search",
    "agent",
    "observability",
    "search-job-api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.urls]
Source = "https://github.com/sn-codebase/sumologic-cli"
"Bug Tracker" = "https://github.com/sn-codebase/sumologic-cli/issues"

[project.scripts]
cli-anything-sumologic = "cli_anything.sumologic.sumologic_cli:main"

[tool.setuptools.packages.find]
include = ["cli_anything.*"]

[tool.setuptools.package-data]
"cli_anything.sumologic" = ["skills/*.md"]
